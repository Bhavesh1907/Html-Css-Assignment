<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Webpage</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      line-height: 1.6;
    }

    /* Navbar */
    .navbar {
      background: #333;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      font-size: 24px;
    }

    .nav-links {
      list-style: none;
      display: flex;
    }

    .nav-links li {
      margin-left: 20px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    /* Content Section */
    .container {
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    .column {
      flex: 1;
      padding: 20px;
      background: #f4f4f4;
      border-radius: 8px;
    }

    /* Footer */
    .footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        flex-direction: column;
        width: 100%;
        margin-top: 10px;
      }

      .nav-links li {
        margin: 10px 0;
      }

      .container {
        flex-direction: column; /* Stack columns */
        padding: 15px;
      }

      .column {
        padding: 15px;
      }

      .navbar h1 {
        font-size: 20px;
      }

      .nav-links a {
        font-size: 14px;
      }

      body {
        font-size: 14px;
      }

      .footer {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h1>My Website</h1>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Content Section -->
  <div class="container">
    <div class="column">
      <h2>Column 1</h2>
      <p>This is the first column. It contains some sample text to demonstrate layout.</p>
    </div>
    <div class="column">
      <h2>Column 2</h2>
      <p>This is the second column. On smaller screens, this will stack below the first column.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
