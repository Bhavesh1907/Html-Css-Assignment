<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      display: flex;
      flex: 1;
      justify-content: space-between; /* Try changing this */
      align-items: stretch; /* Try center, flex-start, etc. */
    }

    aside {
      background: #f4f4f4;
      padding: 20px;
      width: 200px;
    }

    main {
      flex: 1;
      padding: 20px;
      background: #fff;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      aside {
        width: 100%;
        order: 2;
      }

      main {
        order: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Flexbox Page</h1>
  </header>

  <div class="container">
    <aside>
      <h3>Sidebar</h3>
      <p>Links or content here</p>
    </aside>

    <main>
      <h2>Main Content</h2>
      <p>This is the central content area.</p>
      <p>Resize the screen to see responsiveness.</p>
    </main>
  </div>

  <footer>
    <p>Footer Content</p>
  </footer>

</body>
</html>
