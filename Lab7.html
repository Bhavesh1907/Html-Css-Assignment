<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Grid</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 columns */
    grid-gap: 20px; /* spacing between items */
  }

  .card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  .card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
  }

  .card h3 {
    margin: 15px 0 5px;
    font-size: 18px;
  }

  .price {
    color: #27ae60;
    font-size: 16px;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<div class="grid-container">
  <!-- 9 Product Cards -->
  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 1</h3>
    <p class="price">$19.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 2</h3>
    <p class="price">$24.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 3</h3>
    <p class="price">$29.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 4</h3>
    <p class="price">$14.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 5</h3>
    <p class="price">$39.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 6</h3>
    <p class="price">$22.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 7</h3>
    <p class="price">$18.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 8</h3>
    <p class="price">$27.99</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Product">
    <h3>Product 9</h3>
    <p class="price">$31.99</p>
  </div>
</div>

</body>
</html>
