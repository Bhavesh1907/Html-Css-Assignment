<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .profile-card {
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .profile-card:hover {
      transform: translateY(-5px);
    }

    .profile-img {
      width: 150px;
      height: 200px;
      border-radius: 80%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .button:hover {
      background: #4338ca;
    }

    /* Mobile adjustments */
    @media (max-width: 500px) {
      .profile-card {
        padding: 15px;
      }

      .profile-img {
        width: 90px;
        height: 90px;
      }

      h2 {
        font-size: 18px;
      }

      p {
        font-size: 13px;
      }

      .button {
        width: 100%;
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="profile-card">
    <img src="/Users/Piu/Downloads/360_F_590453560_ugMuPncnGYB6XnJqmC8xiPQx4eg3jmMD.jpg" alt="Profile" class="profile-img">
    <h2>Bhavesh</h2>
    <p>Full Stack Developer</p>
    <button class="button">Follow</button>

    <div>
    <p>Gruadute</p>
    <button class="button">Follow</button>
    </div>
  </div>

</body>
</html>
